[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "workhound"
version = "0.1.0"
description = "CLI tool that sniffs out job listings across Workday and Eightfold career sites"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "pandas",
    "urllib3",
]

[project.scripts]
workhound = "workhound.cli:main"

[tool.setuptools.packages.find]
include = ["workhound*"]
